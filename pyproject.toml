[tool.poetry]
name = "ai-negotiation-framework"
version = "0.1.0"
description = "AI-Driven Intelligent Negotiation Framework for Apparel & Accessories procurement"
authors = ["Intelligent Negotiation Framework Contributors <devnull@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.24.0" }
pydantic = "^2.5.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
openpyxl = "^3.1.2"
python-multipart = "^0.0.6"
networkx = "^3.1"
scikit-learn = "^1.3.0"
torch = "^2.1.0"
transformers = "^4.35.0"
shap = "^0.43.0"
statsmodels = "^0.14.0"
matplotlib = "^3.8.0"
plotly = "^5.18.0"
streamlit = "^1.29.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.21"
duckdb = "^0.9.0"
typer = "^0.9.0"
httpx = "^0.25.0"
mlflow = { version = "^2.9.0", optional = true }

[tool.poetry.extras]
tracking = ["mlflow"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.10.0"
ruff = "^0.1.6"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
